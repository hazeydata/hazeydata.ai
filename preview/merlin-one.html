<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 390px;
    height: 420px;
    font-family: 'Inter', -apple-system, sans-serif;
    color: white;
    position: relative;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  .bg {
    position: fixed;
    inset: 0;
    background: 
      radial-gradient(ellipse 400px 300px at 50% 30%, rgba(65, 105, 225, 0.12) 0%, transparent 50%),
      radial-gradient(ellipse 300px 200px at 80% 70%, rgba(138, 43, 226, 0.08) 0%, transparent 50%),
      linear-gradient(135deg, #0a1628 0%, #0d1a35 25%, #101540 50%, #13104a 75%, #0d0a28 100%);
    z-index: 0;
  }

  .content {
    position: relative;
    z-index: 2;
    padding: 24px 20px;
  }

  .glass-card {
    background: rgba(135, 155, 195, 0.09);
    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);
    border: 0.8px solid rgba(255, 255, 255, 0.12);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), 0 2px 8px rgba(255, 255, 255, 0.05) inset;
    position: relative;
  }

  .glass-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
    pointer-events: none;
  }

  .card-header {
    padding: 16px 20px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .card-title {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.2px;
    color: rgba(255, 255, 255, 0.4);
    text-transform: uppercase;
  }

  /* Ride list */
  .ride-list {
    padding: 14px 20px 0;
  }

  .ride-row {
    display: flex;
    align-items: center;
    padding: 12px 0;
    gap: 12px;
  }

  .ride-rank {
    width: 28px; height: 28px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 800;
    flex-shrink: 0;
    background: linear-gradient(135deg, rgba(74, 200, 164, 0.3) 0%, rgba(74, 200, 164, 0.15) 100%);
    color: rgba(74, 200, 164, 1);
    box-shadow: 0 0 12px rgba(74, 200, 164, 0.2);
  }

  .ride-info {
    flex: 1;
    min-width: 0;
  }

  .ride-name {
    font-size: 15px;
    font-weight: 600;
    color: white;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .ride-subtitle {
    font-size: 12px;
    font-weight: 500;
    margin-top: 2px;
    color: rgba(74, 200, 164, 0.8);
  }

  .ride-wait {
    text-align: right;
    flex-shrink: 0;
  }

  .ride-wait-value {
    font-size: 22px;
    font-weight: 700;
    color: rgba(155, 196, 242, 1);
    font-variant-numeric: tabular-nums;
  }

  .ride-wait-unit {
    font-size: 9px;
    font-weight: 700;
    color: rgba(255, 255, 255, 0.3);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .ride-wait-bar {
    width: 54px;
    height: 3px;
    border-radius: 2px;
    margin-top: 4px;
    margin-left: auto;
    background: linear-gradient(90deg, #0A2F8F, #9BC4F2);
  }

  /* Add button row */
  .add-row {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px 20px 20px;
    border-top: 0.5px solid rgba(255, 255, 255, 0.06);
    margin-top: 8px;
  }

  .add-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 10px 22px;
    border-radius: 12px;
    border: 1.5px dashed rgba(255, 255, 255, 0.15);
    background: rgba(255, 255, 255, 0.03);
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.35);
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    width: 100%;
  }

  .add-btn:hover {
    background: rgba(255, 255, 255, 0.06);
    border-color: rgba(255, 255, 255, 0.25);
    color: rgba(255, 255, 255, 0.6);
  }

  /* Rode it button */
  .action-section {
    padding: 0 20px 20px;
  }

  .done-btn {
    width: 100%;
    padding: 14px;
    border-radius: 14px;
    border: none;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    background: linear-gradient(135deg, rgba(74, 144, 164, 0.9) 0%, rgba(74, 144, 164, 1) 100%);
    color: white;
    box-shadow: 0 4px 15px rgba(74, 144, 164, 0.3);
    letter-spacing: 0.3px;
    transition: all 0.3s;
  }

  .state-label {
    position: fixed;
    top: 12px; left: 20px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1px;
    color: rgba(255,255,255,0.2);
    text-transform: uppercase;
    z-index: 10;
  }
</style>
</head>
<body>
<div class="bg"></div>
<div class="state-label">1 Ride Selected</div>

<div class="content">
  <div class="glass-card">
    <div class="card-header">
      <span class="card-title">🎢 My Must-Dos</span>
    </div>

    <!-- Single ride selected -->
    <div class="ride-list">
      <div class="ride-row">
        <div class="ride-rank">1</div>
        <div class="ride-info">
          <div class="ride-name">Seven Dwarfs Mine Train</div>
          <div class="ride-subtitle">+18 min gain · ride now</div>
        </div>
        <div class="ride-wait">
          <div class="ride-wait-value">25</div>
          <div class="ride-wait-unit">min wait</div>
          <div class="ride-wait-bar"></div>
        </div>
      </div>
    </div>

    <!-- Add button -->
    <div class="add-row">
      <button class="add-btn">+ Add</button>
    </div>

    <!-- Rode it -->
    <div class="action-section">
      <button class="done-btn">Rode it ✓</button>
    </div>
  </div>
</div>
</body>
</html>
