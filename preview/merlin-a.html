<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 390px;
    min-height: 700px;
    font-family: 'Inter', -apple-system, sans-serif;
    color: white;
    position: relative;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  .bg {
    position: fixed;
    inset: 0;
    background: 
      radial-gradient(ellipse 400px 300px at 50% 30%, rgba(65, 105, 225, 0.12) 0%, transparent 50%),
      radial-gradient(ellipse 300px 200px at 80% 70%, rgba(138, 43, 226, 0.08) 0%, transparent 50%),
      linear-gradient(135deg, #0a1628 0%, #0d1a35 25%, #101540 50%, #13104a 75%, #0d0a28 100%);
    z-index: 0;
  }

  .content {
    position: relative;
    z-index: 2;
    padding: 24px 20px;
  }

  /* === CONCEPT A: "Neural Pulse" === */

  .glass-card {
    background: rgba(135, 155, 195, 0.09);
    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);
    border: 0.8px solid rgba(255, 255, 255, 0.12);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), 0 2px 8px rgba(255, 255, 255, 0.05) inset;
    position: relative;
  }

  .glass-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
    pointer-events: none;
  }

  .card-header {
    padding: 16px 20px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .card-title {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.2px;
    color: rgba(255, 255, 255, 0.4);
    text-transform: uppercase;
  }

  .card-badge {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.5px;
    padding: 3px 8px;
    border-radius: 6px;
    background: rgba(74, 144, 164, 0.15);
    color: rgba(74, 144, 164, 0.9);
    text-transform: uppercase;
  }

  /* Ride Selection */
  .ride-grid {
    padding: 16px 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .ride-chip {
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    overflow: hidden;
  }

  .ride-chip.selected {
    background: rgba(255, 255, 255, 0.12);
    border: 1.5px solid rgba(255, 255, 255, 0.25);
    color: white;
  }

  .ride-chip.selected::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 3px; height: 100%;
    border-radius: 2px 0 0 2px;
  }

  .ride-chip.unselected {
    background: rgba(255, 255, 255, 0.04);
    border: 1.5px solid rgba(255, 255, 255, 0.08);
    color: rgba(255, 255, 255, 0.4);
  }

  .ride-chip .remove {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    font-size: 10px;
    margin-left: 8px;
    cursor: pointer;
  }

  .ride-chip.add-ride {
    background: none;
    border: 1.5px dashed rgba(255, 255, 255, 0.15);
    color: rgba(255, 255, 255, 0.35);
    font-weight: 500;
  }

  /* The Engine Section */
  .engine-section {
    margin: 0 20px;
    padding: 20px 0;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
  }

  /* Neural visualization */
  .neural-container {
    position: relative;
    height: 100px;
    margin-bottom: 16px;
    border-radius: 12px;
    background: rgba(0, 0, 0, 0.2);
    overflow: hidden;
  }

  .neural-canvas {
    width: 100%;
    height: 100%;
  }

  .neural-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 4px;
  }

  .neural-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 500;
    color: rgba(74, 144, 164, 0.8);
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .neural-status {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.5);
  }

  /* Recommendation Result */
  .recommendation {
    text-align: center;
    padding: 4px 0 20px;
  }

  .rec-eyebrow {
    font-size: 11px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.4);
    letter-spacing: 0.5px;
    margin-bottom: 8px;
  }

  .rec-ride-name {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.5px;
    margin-bottom: 4px;
    background: linear-gradient(135deg, #fff 0%, rgba(255,255,255,0.85) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .rec-meta {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 16px;
  }

  .rec-wait {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 13px;
    font-weight: 600;
  }

  .rec-wait .dot {
    width: 8px; height: 8px;
    border-radius: 4px;
  }

  .rec-wait .val {
    color: rgba(255,255,255,0.8);
  }

  .rec-wait .unit {
    color: rgba(255,255,255,0.4);
    font-weight: 500;
  }

  .rec-saving {
    font-size: 12px;
    font-weight: 600;
    color: rgba(74, 200, 164, 0.9);
  }

  .done-btn {
    width: 100%;
    padding: 14px;
    border-radius: 14px;
    border: none;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    background: linear-gradient(135deg, rgba(74, 144, 164, 0.9) 0%, rgba(74, 144, 164, 1) 100%);
    color: white;
    box-shadow: 0 4px 15px rgba(74, 144, 164, 0.3);
    letter-spacing: 0.3px;
  }

  .done-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(74, 144, 164, 0.4);
  }

  /* Data points ticker */
  .data-ticker {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-top: 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: rgba(255, 255, 255, 0.25);
  }

  .data-ticker .pulse {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: rgba(74, 200, 164, 0.6);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.4; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.3); }
  }

  /* Concept label */
  .concept-label {
    position: fixed;
    top: 12px; left: 20px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1px;
    color: rgba(255,255,255,0.2);
    text-transform: uppercase;
    z-index: 10;
  }
</style>
</head>
<body>
<div class="bg"></div>
<div class="concept-label">Concept A — Neural Pulse</div>

<div class="content">
  <div class="glass-card">
    <div class="card-header">
      <span class="card-title">🎢 My Must-Dos</span>
      <span class="card-badge">Live</span>
    </div>

    <!-- Ride Selection -->
    <div class="ride-grid">
      <div class="ride-chip selected" style="--accent: #5A96EA;">
        <span style="position:absolute;top:0;left:0;width:3px;height:100%;background:#5A96EA;border-radius:2px 0 0 2px;"></span>
        Space Mountain <span class="remove">×</span>
      </div>
      <div class="ride-chip selected" style="--accent: #C1DDFC;">
        <span style="position:absolute;top:0;left:0;width:3px;height:100%;background:#C1DDFC;border-radius:2px 0 0 2px;"></span>
        Seven Dwarfs <span class="remove">×</span>
      </div>
      <div class="ride-chip selected" style="--accent: #FFB1C9;">
        <span style="position:absolute;top:0;left:0;width:3px;height:100%;background:#FFB1C9;border-radius:2px 0 0 2px;"></span>
        Big Thunder <span class="remove">×</span>
      </div>
      <div class="ride-chip add-ride">+ Add</div>
    </div>

    <!-- Engine Visualization -->
    <div class="engine-section">
      <div class="neural-container">
        <canvas class="neural-canvas" id="neuralCanvas"></canvas>
        <div class="neural-overlay">
          <div class="neural-label">Analyzing wait patterns</div>
          <div class="neural-status" id="neuralStatus">optimizing route...</div>
        </div>
      </div>

      <!-- Recommendation -->
      <div class="recommendation">
        <div class="rec-eyebrow">Ride now</div>
        <div class="rec-ride-name">Seven Dwarfs Mine Train</div>
        <div class="rec-meta">
          <div class="rec-wait">
            <div class="dot" style="background: #C1DDFC;"></div>
            <span class="val">25</span>
            <span class="unit">min</span>
          </div>
          <div class="rec-saving">↓ saves 18 min vs later</div>
        </div>
        <button class="done-btn">Done ✓</button>
        <div class="data-ticker">
          <div class="pulse"></div>
          <span>analyzing 4,200+ data points</span>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  // Neural network visualization
  const canvas = document.getElementById('neuralCanvas');
  const ctx = canvas.getContext('2d');
  canvas.width = 350 * 2;
  canvas.height = 100 * 2;
  ctx.scale(2, 2);

  const nodes = [];
  const connections = [];

  // Create neural network nodes in 4 layers
  const layers = [
    { count: 3, x: 60, label: 'rides' },    // Input: selected rides
    { count: 5, x: 130 },                     // Hidden 1
    { count: 4, x: 210 },                     // Hidden 2
    { count: 1, x: 290, label: 'optimal' },  // Output: recommendation
  ];

  layers.forEach((layer, li) => {
    for (let i = 0; i < layer.count; i++) {
      const y = 15 + (70 / (layer.count + 1)) * (i + 1);
      nodes.push({ x: layer.x, y, layer: li, active: Math.random() });
    }
  });

  // Create connections between adjacent layers
  let nodeIdx = 0;
  for (let li = 0; li < layers.length - 1; li++) {
    const startIdx = nodeIdx;
    const count1 = layers[li].count;
    const count2 = layers[li + 1].count;
    const nextIdx = startIdx + count1;
    
    for (let i = 0; i < count1; i++) {
      for (let j = 0; j < count2; j++) {
        connections.push({
          from: startIdx + i,
          to: nextIdx + j,
          weight: Math.random(),
          phase: Math.random() * Math.PI * 2,
        });
      }
    }
    nodeIdx += count1;
  }

  function draw(t) {
    ctx.clearRect(0, 0, 350, 100);

    // Draw connections with flowing pulses
    connections.forEach(c => {
      const from = nodes[c.from];
      const to = nodes[c.to];
      const pulse = (Math.sin(t * 0.003 + c.phase) + 1) / 2;
      const alpha = 0.03 + pulse * 0.08;
      
      ctx.beginPath();
      ctx.moveTo(from.x, from.y);
      ctx.lineTo(to.x, to.y);
      ctx.strokeStyle = `rgba(74, 144, 164, ${alpha})`;
      ctx.lineWidth = 0.5;
      ctx.stroke();

      // Flowing dot
      const flowT = ((t * 0.001 + c.phase) % 1);
      const fx = from.x + (to.x - from.x) * flowT;
      const fy = from.y + (to.y - from.y) * flowT;
      ctx.beginPath();
      ctx.arc(fx, fy, 1.2, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(74, 200, 164, ${0.3 + pulse * 0.5})`;
      ctx.fill();
    });

    // Draw nodes
    nodes.forEach((n, i) => {
      const glow = (Math.sin(t * 0.004 + i * 0.7) + 1) / 2;
      const r = n.layer === 3 ? 5 : (n.layer === 0 ? 4 : 3);
      
      // Glow
      ctx.beginPath();
      ctx.arc(n.x, n.y, r + 3, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(74, 144, 164, ${0.05 + glow * 0.1})`;
      ctx.fill();
      
      // Node
      ctx.beginPath();
      ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
      const brightness = n.layer === 3 ? 0.9 : (0.3 + glow * 0.4);
      ctx.fillStyle = n.layer === 3 
        ? `rgba(74, 200, 164, ${brightness})`
        : `rgba(74, 144, 164, ${brightness})`;
      ctx.fill();
    });

    requestAnimationFrame(draw);
  }

  requestAnimationFrame(draw);

  // Cycle status text
  const statuses = ['optimizing route...', 'comparing wait curves...', 'calculating gain...', 'recommendation ready'];
  let statusIdx = 0;
  setInterval(() => {
    statusIdx = (statusIdx + 1) % statuses.length;
    document.getElementById('neuralStatus').textContent = statuses[statusIdx];
  }, 2500);
</script>
</body>
</html>
