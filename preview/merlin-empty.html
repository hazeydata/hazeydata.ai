<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 390px;
    height: 360px;
    font-family: 'Inter', -apple-system, sans-serif;
    color: white;
    position: relative;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  .bg {
    position: fixed;
    inset: 0;
    background: 
      radial-gradient(ellipse 400px 300px at 50% 30%, rgba(65, 105, 225, 0.12) 0%, transparent 50%),
      radial-gradient(ellipse 300px 200px at 80% 70%, rgba(138, 43, 226, 0.08) 0%, transparent 50%),
      linear-gradient(135deg, #0a1628 0%, #0d1a35 25%, #101540 50%, #13104a 75%, #0d0a28 100%);
    z-index: 0;
  }

  .content {
    position: relative;
    z-index: 2;
    padding: 24px 20px;
  }

  .glass-card {
    background: rgba(135, 155, 195, 0.09);
    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);
    border: 0.8px solid rgba(255, 255, 255, 0.12);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), 0 2px 8px rgba(255, 255, 255, 0.05) inset;
    position: relative;
  }

  .glass-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
    pointer-events: none;
  }

  .card-header {
    padding: 16px 20px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .card-title {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.2px;
    color: rgba(255, 255, 255, 0.4);
    text-transform: uppercase;
  }

  /* Empty state */
  .empty-state {
    padding: 32px 20px 36px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .empty-icon {
    font-size: 36px;
    margin-bottom: 14px;
    opacity: 0.6;
  }

  .empty-title {
    font-size: 16px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.7);
    margin-bottom: 6px;
    letter-spacing: -0.2px;
  }

  .empty-subtitle {
    font-size: 13px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.3);
    margin-bottom: 20px;
    line-height: 1.4;
  }

  .add-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 12px 28px;
    border-radius: 14px;
    border: none;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    background: linear-gradient(135deg, rgba(74, 144, 164, 0.9) 0%, rgba(74, 144, 164, 1) 100%);
    color: white;
    box-shadow: 0 4px 15px rgba(74, 144, 164, 0.3);
    letter-spacing: 0.3px;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .add-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(74, 144, 164, 0.4);
  }

  .state-label {
    position: fixed;
    top: 12px; left: 20px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1px;
    color: rgba(255,255,255,0.2);
    text-transform: uppercase;
    z-index: 10;
  }
</style>
</head>
<body>
<div class="bg"></div>
<div class="state-label">Empty State — First Open</div>

<div class="content">
  <div class="glass-card">
    <div class="card-header">
      <span class="card-title">🎢 My Must-Dos</span>
    </div>

    <div class="empty-state">
      <div class="empty-icon">🎢</div>
      <div class="empty-title">What can't you miss?</div>
      <div class="empty-subtitle">Pick up to 4 rides — we'll optimize your order.</div>
      <button class="add-btn">+ Add</button>
    </div>
  </div>
</div>
</body>
</html>
