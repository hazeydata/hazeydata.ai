name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Check GoatCounter tag
        run: python3 scripts/check-goatcounter-tpcr.py

      - name: Build public site
        run: bash scripts/build-public-site.sh

      - name: Check deploy files
        run: python3 scripts/check-deploy-files.py dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=hazeydata
