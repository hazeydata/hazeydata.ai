name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Check GoatCounter tag
        run: python3 scripts/check-goatcounter-tpcr.py

      - name: Build public site
        run: bash scripts/build-public-site.sh

      - name: Check deploy files
        run: python3 scripts/check-deploy-files.py dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=hazeydata

      - name: Verify signups table exists (read-only)
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute hazeydata-signups --remote --command "SELECT count(*) AS n FROM signups"

      - name: Verify signup Function is live (GET only, expects 405)
        run: |
          code=$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' https://hazeydata.ai/api/subscribe)
          echo "GET /api/subscribe -> $code"
          test "$code" = "405"
