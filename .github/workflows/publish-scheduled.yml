name: Publish Scheduled Blog Posts

on:
  schedule:
    # Run daily at 10:00 UTC (6:00 AM ET)
    - cron: '0 10 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish scheduled posts
        run: python3 .github/scripts/publish_scheduled.py

      - name: Commit and push
        run: |
          git config user.name "HazeyData Bot"
          git config user.email "bot@hazeydata.ai"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to publish today."
          else
            git commit -m "blog: publish scheduled posts for $(date -u +%Y-%m-%d)"
            git push
          fi
